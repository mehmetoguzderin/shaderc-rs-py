[package]
name = "shaderc-rs-py"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "shadercrs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = [ "abi3-py312", "anyhow", "chrono", "chrono-tz", "either", "extension-module", "eyre", "generate-import-lib", "hashbrown", "indexmap", "serde", "smallvec" ] }
shaderc = { version = "0.10.1", features = [ "build-from-source", "prefer-static-linking" ] }
